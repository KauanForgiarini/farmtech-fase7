; Compilação opcional com PlatformIO (VS Code) para rodar no Wokwi for VS Code.
; O código também pode ser colado diretamente em https://wokwi.com (ESP32 DevKit V1).
[platformio]
src_dir = farmtech_irrigacao

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = beegee-tokyo/DHT sensor library for ESPx@^1.19
